<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Logic Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            background: #161623;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .hidden { display: none !important; }
        h1 { color: #4e54c8; margin-bottom: 10px; }
        h2 { margin-bottom: 20px; font-size: 22px; }
        
        /* Buttons */
        button {
            padding: 14px 28px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background: #4e54c8; color: white; width: 100%; }
        .btn-primary:hover { background: #6469ff; }
        .btn-skip { background: #e94560; color: white; padding: 10px 20px; font-size: 14px; }
        .btn-skip:hover { background: #ff5e7e; }

        /* Game Layout */
        .image-drop-zone {
            width: 100%;
            height: 200px;
            background: #232338;
            border: 3px dashed #4e54c8;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .image-drop-zone img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .image-drop-zone.drag-over {
            border-color: #4ecc71;
            background: #2a2a45;
        }

        /* Drag Items */
        .drag-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .drag-item {
            background: #30304d;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: grab;
            font-weight: bold;
            border: 2px solid #4e54c8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .drag-item:active { cursor: grabbing; }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #232338;
            padding-top: 15px;
        }
        .score { font-size: 18px; color: #4ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 🏠 HOMEPAGE SCREEN -->
    <div class="container" id="home-screen">
        <h1>Logic Puzzle</h1>
        <p style="color: #a0a0ba; margin-bottom: 30px;">Drag the correct answer box onto the image!</p>
        <button class="btn-primary" id="start-btn">Play Game 🎮</button>
    </div>

    <!-- 🎮 GAMEPLAY SCREEN -->
    <div class="container hidden" id="game-screen">
        <h2 id="question-text">Loading question...</h2>
        
        <!-- The Target Drop Area -->
        <div class="image-drop-zone" id="drop-zone">
            <img id="quiz-img" src="" alt="Quiz Visual">
        </div>

        <!-- The Draggable Choices -->
        <div class="drag-options" id="drag-options-container">
            <!-- Dynamic drag items go here -->
        </div>

        <div class="footer-controls">
            <div class="score">Score: <span id="score-val">0</span></div>
            <button class="btn-skip" id="skip-btn">Skip ➡️</button>
        </div>
    </div>

    <!-- 🎉 END SCREEN -->
    <div class="container hidden" id="end-screen">
        <h2>🎉 Finished!</h2>
        <p style="font-size: 20px;">Final Score: <strong style="color:#4ecc71;" id="final-score">0</strong></p>
        <button class="btn-primary" onclick="location.reload()">Play Again</button>
    </div>

<script>
    // 🧠 CONFIGURATION: Keep your file names exactly matching your uploaded images!
    const quizData = [
        {
            question: "Drag the right pilot for this spaceship:",
            image: "pic1.png", 
            options: ["Alien", "Human", "Robot"],
            correct: "Alien" // Must match text exactly
        },
        {
            question: "Match the animal to its correct logic box:",
            image: "pic2.png",
            options: ["Dog", "Cat", "Bird"],
            correct: "Dog"
        }
    ];

    let currentIdx = 0;
    let score = 0;

    // Screens
    const homeScreen = document.getElementById('home-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');

    // Game Elements
    const startBtn = document.getElementById('start-btn');
    const skipBtn = document.getElementById('skip-btn');
    const dropZone = document.getElementById('drop-zone');
    const questionText = document.getElementById('question-text');
    const quizImg = document.getElementById('quiz-img');
    const dragContainer = document.getElementById('drag-options-container');
    const scoreVal = document.getElementById('score-val');
    const finalScore = document.getElementById('final-score');

    // Switch Screens
    startBtn.addEventListener('click', () => {
        homeScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        loadLevel();
    });

    // Load Levels & Setup Drag Events
    function loadLevel() {
        if (currentIdx >= quizData.length) {
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            finalScore.innerText = score;
            return;
        }

        const data = quizData[currentIdx];
        questionText.innerText = data.question;
        quizImg.src = data.image;
        dragContainer.innerHTML = '';

        // Generate drag buttons dynamically
        data.options.forEach(option => {
            const item = document.createElement('div');
            item.classList.add('drag-item');
            item.innerText = option;
            item.setAttribute('draggable', 'true');
            
            // HTML5 Drag Events
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', option);
            });

            dragContainer.appendChild(item);
        });
    }

    // Drop Zone Event Listeners
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault(); // Required to allow dropping
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        
        const droppedText = e.dataTransfer.getData('text/plain');
        const correctText = quizData[currentIdx].correct;

        if (droppedText === correctText) {
            score += 100;
            scoreVal.innerText = score;
        }
        
        currentIdx++;
        loadLevel();
    });

    // Skip functionality
    skipBtn.addEventListener('click', () => {
        currentIdx++;
        loadLevel();
    });
</script>
</body>
</html>
